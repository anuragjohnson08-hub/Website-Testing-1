<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genovaris Lifesciences | Update in Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020b18;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-center">
    
    <div class="max-w-md w-full p-8 rounded-2xl border border-white/10 bg-white/5 backdrop-blur-sm">
        
        <!-- DNA Helix Animation -->
        <div class="relative w-full h-40 mb-4 flex items-center justify-center overflow-hidden rounded-lg bg-navy-900/30">
            <canvas id="dnaCanvas" class="absolute inset-0 w-full h-full"></canvas>
        </div>

        <h1 class="text-2xl font-bold tracking-wider mb-2 text-white">
            GEN<span class="text-cyan-400">OVARIS</span>
        </h1>
        
        <h2 class="text-lg text-white/90 mb-4">System Update in Progress</h2>
        
        <p class="text-sm text-white/60 font-light leading-relaxed mb-6">
            We are currently updating our website to serve you better. Please check back in a few moments.
        </p>

        <p class="text-xs text-cyan-400/80">
            genovarislifesciences@gmail.com | 8102946105
        </p>

    </div>

    <script>
        (function initMaintenanceDNA() {
            const canvas = document.getElementById('dnaCanvas');
            const ctx = canvas.getContext('2d', {
                alpha: true,
                desynchronized: true
            });

            let width = 0;
            let height = 0;
            let time = 0;
            let animationFrame = null;

            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function resize() {
                const rect = canvas.getBoundingClientRect();
                width = rect.width || 320;
                height = rect.height || 160;

                canvas.width = width;
                canvas.height = height;
            }

            resize();
            window.addEventListener('resize', resize, { passive: true });

            function draw() {
                ctx.clearRect(0, 0, width, height);

                const dnaHeight = height * 0.85;
                const radius = 32;
                const centerX = width / 2;
                const centerY = height / 2;
                const yStart = centerY - dnaHeight / 2;
                const spacing = 15;
                const loops = 2;

                for (let y = 0; y <= dnaHeight; y += spacing) {
                    const progress = y / dnaHeight;
                    const angle = progress * Math.PI * 2 * loops + time;

                    const x1 = centerX + Math.cos(angle) * radius;
                    const z1 = Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle + Math.PI) * radius;
                    const z2 = Math.sin(angle + Math.PI) * radius;

                    const screenY = yStart + y;
                    const depth1 = (z1 + radius) / (radius * 2);
                    const depth2 = (z2 + radius) / (radius * 2);

                    const size1 = 1 + depth1 * 1.8;
                    const size2 = 1 + depth2 * 1.8;

                    const alpha1 = 0.2 + depth1 * 0.8;
                    const alpha2 = 0.2 + depth2 * 0.8;

                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(x1, screenY);
                    ctx.lineTo(x2, screenY);
                    ctx.stroke();

                    ctx.fillStyle = `rgba(255,255,255,${alpha1})`;
                    ctx.beginPath();
                    ctx.arc(x1, screenY, size1, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = `rgba(255,255,255,${alpha2})`;
                    ctx.beginPath();
                    ctx.arc(x2, screenY, size2, 0, Math.PI * 2);
                    ctx.fill();
                }

                time += 0.02;
                animationFrame = requestAnimationFrame(draw);
            }

            if (!reducedMotion) {
                animationFrame = requestAnimationFrame(draw);
            }
        })();
    </script>

</body>
</html>
